<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Řídicí panel R.P.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panel R.P.">
<meta name="theme-color" content="#0e0d0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: {
        bg: 'var(--bg)', panel: 'var(--panel)', panel2: 'var(--panel2)', line: 'var(--line)',
        fg: 'var(--fg)', muted: 'var(--muted)', accent: 'var(--accent)', teal: 'var(--teal)',
        danger: 'var(--danger)', ok: 'var(--ok)'
      },
      fontFamily: {
        display: ['Inter', 'system-ui', 'sans-serif'],
        body: ['Inter', 'system-ui', 'sans-serif'],
        mono: ['Inter', 'system-ui', 'sans-serif']
      }
    } }
  };
</script>
<style>
  /* Vzhled: teplá skoro-černá, plochý. Hloubka jen světlostí (pozadí → karta → vnořený panel), bez rámečků a stínů.
     Jediná barva dat je limetková (--accent); tlačítka, záložky a navigace zůstávají bez barvy.
     Hlavní akce = bílá „pilulka“ s černým textem. Písmo Inter 400–600. */
  :root {
    --bg: #0e0d0c;
    --panel: #181716;
    --panel2: #262422;
    --hover: #322f2c;
    --line: #2b2926;
    --fg: #f4f2ef;
    --muted: #b3aea8;
    --faint: #96918b;
    --accent: #c6f24e;      /* jediná barva dat */
    --accent-soft: #222a10;
    --teal: #e2ded8;        /* druhá datová řada = světle šedá, ne další barva */
    --teal-soft: #262422;
    --danger: #e5484d;
    --danger-soft: #2c1a1c;
    --warn: #e5a93b;
    --warn-soft: #2b2414;
    --ok: #c6f24e;
    --ok-soft: #222a10;
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--fg); }
  body { margin: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-tap-highlight-color: transparent; }
  body { font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  @media (min-width: 768px) { .gutter { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
  .grid-bg { display: none; }
  h1, h2, h3 { text-wrap: balance; letter-spacing: -0.01em; }
  .font-bold { font-weight: 600 !important; }
  .tnum, .font-mono { font-variant-numeric: tabular-nums; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; }
  .text-muted { color: var(--muted); }
  .label { font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .card { background: var(--panel); border: 0; border-radius: 20px; }
  .card.border-dashed { background: transparent; border: 1.5px dashed var(--line); }
  .field {
    background: var(--panel2); border: 1px solid transparent; border-radius: 12px; color: var(--fg);
    padding: 7px 12px; font-size: 16px; line-height: 24px; min-width: 0; width: 100%; min-height: 40px;
  }
  .field::placeholder { color: var(--faint); }
  .field:focus { outline: none; border-color: var(--muted); }
  select.field { appearance: none; background-image: none; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; padding: 0 16px; height: 40px;
    font-weight: 500; font-size: 14px; border: 0; background: var(--panel2); color: var(--fg);
    transition: background .15s, color .15s, transform .1s; white-space: nowrap;
  }
  .btn:hover { background: var(--hover); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .4; pointer-events: none; }
  .btn-primary { background: #fff; color: #000; font-weight: 600; }
  .btn-primary:hover { background: #e4e2df; }
  .icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 999px; color: var(--faint); border: 0; flex: none; transition: background .15s, color .15s; }
  .icon-btn:hover { color: var(--fg); background: var(--panel2); }
  .icon-btn.danger:hover { color: var(--danger); }
  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 500; border: 0; background: var(--panel2); color: var(--muted); white-space: nowrap; }
  button.chip { transition: background .15s, color .15s; }
  button.chip:hover { background: var(--hover); color: var(--fg); }
  .chip-hi { color: #ef6b6f; background: var(--danger-soft); }
  .chip-mid { color: var(--warn); background: var(--warn-soft); }
  .chip-lo { color: var(--fg); background: var(--panel2); }
  .chip-ok { color: var(--ok); background: var(--ok-soft); }
  .chip-solid, button.chip-solid:hover { background: #fff; color: #000; font-weight: 600; }
  .seg { display: inline-flex; background: var(--panel2); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .seg button { padding: 5px 13px; font-size: 13.5px; font-weight: 500; color: var(--muted); border-radius: 999px; transition: background .15s, color .15s; }
  .seg button:hover { color: var(--fg); }
  .seg button[aria-pressed="true"] { background: #fff; color: #000; }
  .tab { display: inline-flex; align-items: center; gap: 8px; padding: 14px 2px 13px; margin-right: 24px; color: #8f8a84; font-weight: 500; font-size: 15px; white-space: nowrap; transition: color .15s; }
  .tab svg { opacity: .8; }
  .tab[aria-selected="true"] { color: #fff; }
  .tab[aria-selected="true"] svg { opacity: 1; }
  .tab:hover { color: #fff; }
  .tab .chip { background: var(--panel2); color: var(--fg); padding: 0 7px !important; font-size: 12px; }
  .hot { background: #1c2111; }
  .check { width: 24px; height: 24px; border-radius: 999px; border: 1.5px solid #6b6661; display: inline-grid; place-items: center; flex: none; color: var(--bg); transition: background .15s, border-color .15s; }
  .check:hover { border-color: var(--fg); }
  .check.on { background: var(--ok); border-color: var(--ok); }
  .gcal { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 500; color: var(--fg); border: 0; background: var(--panel2); white-space: nowrap; text-decoration: none; }
  .gcal:hover { background: var(--hover); }
  .gcal.off { opacity: .45; cursor: not-allowed; color: var(--muted); background: transparent; }
  .cal-scroll { overflow-x: auto; }
  .cal-inner { min-width: 760px; }
  .cal-cols { display: grid; grid-template-columns: 52px repeat(7, minmax(0, 1fr)); }
  .cal-daycol { position: relative; border-left: 1px solid var(--line); background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px 44px); }
  .cal-ev { position: absolute; border-radius: 6px; padding: 2px 5px; font-size: 11.5px; line-height: 1.25; overflow: hidden; text-align: left; border: 1px solid var(--panel); }
  .cal-ev:hover, .cal-ad:hover { filter: brightness(1.12); }
  .cal-ad { border-radius: 5px; padding: 1px 6px; font-size: 11.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; margin: 0 1px; }
  .cal-now { position: absolute; left: 0; right: 0; height: 2px; background: var(--accent); z-index: 2; }
  .cal-now::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  button.gcal { cursor: pointer; }
  button.gcal:disabled { opacity: .6; cursor: progress; }
  .seg-sm button { padding: 4px 10px; font-size: 12.5px; }
  .search { position: relative; }
  .search .field { padding-left: 36px; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); }
  .bar { height: 8px; border-radius: 99px; background: var(--panel2); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }
  .scroll-x { overflow-x: auto; scrollbar-width: none; }
  .scroll-x::-webkit-scrollbar { display: none; }
  .done-text { text-decoration: line-through; color: var(--faint); }
  input[type="range"], input[type="checkbox"] { accent-color: var(--accent); }

  /* Zdraví */
  .h-glasses { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; }
  .h-glasses > span { height: 44px; border-radius: 10px; background: var(--panel2); transition: background .25s; }
  .h-glasses > span.on { background: var(--accent); }
  @media (max-width: 480px) { .h-glasses { gap: 4px; } .h-glasses > span { height: 36px; border-radius: 8px; } }
  .h-scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .h-scale button { height: 44px; border-radius: 12px; background: var(--panel2); color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; transition: background .15s, color .15s; }
  .h-scale button:hover { color: var(--fg); }
  .h-scale button.on { background: #fff; color: #000; }
  .h-pain-btn { width: 100%; height: 56px; border-radius: 999px; background: var(--danger); color: #fff; font-weight: 600; font-size: 17px; transition: filter .15s, transform .1s; }
  .h-pain-btn:hover { filter: brightness(1.08); }
  .h-pain-btn:active { transform: scale(.985); }
  .h-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .h-table th:not(:last-child), .h-table td:not(:last-child) { width: 1%; white-space: nowrap; padding-right: 32px; }
  .h-val { display: inline-block; min-width: 48px; text-align: right; }
  .h-table .only-sm { display: none; }
  .h-table tr.h-sub td { border-top: 0; padding-top: 0; color: #ef6b6f; font-size: 13.5px; white-space: normal; width: auto; }
  @media (max-width: 639px) {
    .h-table .no-sm { display: none; }
    .h-table tr.only-sm { display: table-row; }
    .h-table th:not(:last-child), .h-table td:not(:last-child) { padding-right: 0; width: auto; }
    .h-table td.num, .h-table th.num { padding-left: 12px; }
    .h-table tr.has-sub td { padding-bottom: 4px; }
    .h-mini { width: 28px; margin-right: 8px; }
  }
  .h-table th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 0 16px 8px 0; }
  .h-table td { padding: 10px 16px 10px 0; border-top: 1px solid var(--line); vertical-align: middle; }
  .h-table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .h-table tr.pain td:last-child { color: #ef6b6f; }
  .h-table tr.pain td:first-child { color: #fff; font-weight: 600; }
  .h-mini { display: inline-block; width: 40px; height: 6px; border-radius: 99px; background: var(--panel2); margin-right: 10px; vertical-align: middle; overflow: hidden; }
  .h-mini > span { display: block; height: 100%; background: var(--accent); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="root">
  <div class="gutter" style="padding-block: 40px; color: var(--muted); ">Načítám řídicí panel…</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/lucide-react@0.344.0/dist/umd/lucide-react.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="resell.js"></script>

<script src="panel.js"></script>
<script>
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>

</body>
</html>
